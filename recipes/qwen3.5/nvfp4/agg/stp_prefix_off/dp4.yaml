# Qwen3.5-397B-A17B-NVFP4 Aggregated DP4 on GB200
# Data Parallel: DP4 with dp-attention, no expert parallel

name: "nvfp4-agg-dp4"

model:
  path: "qwen3.5-nvfp4"
  container: "dev"
  precision: "fp4"

# fixed hanging issue & perf regression
dynamo:
  hash: "ebbb698fef7543714ffe17d84abdd8d27bf70e01"

resources:
  gpu_type: "gb200"
  gpus_per_node: 4
  agg_nodes: 1
  agg_workers: 1

backend:
  type: sglang

  aggregated_environment:
    PYTHONUNBUFFERED: "1"
    NCCL_MNNVL_ENABLE: "1"
    NCCL_CUMEM_ENABLE: "1"
    SGLANG_DG_CACHE_DIR: "/configs/deepgemm-cache"
    FLASHINFER_WORKSPACE_BASE: "/configs/flashinfer-cache"
    SGLANG_DISABLE_TP_MEMORY_INBALANCE_CHECK: "1"

  sglang_config:
    aggregated:
      served-model-name: "nvidia/Qwen3.5-397B-A17B-NVFP4"
      model-path: "/model/"

      attention-backend: "trtllm_mha"
      quantization: "modelopt_fp4"

      # DP4: DP4 with dp-attention, no expert parallel
      tensor-parallel-size: 4
      data-parallel-size: 4
      enable-dp-attention: true

      mamba-ssm-dtype: "bfloat16"
      moe-runner-backend: "flashinfer_trtllm"

      disable-radix-cache: true
      max-running-requests: 1024
      mem-fraction-static: 0.80
      chunked-prefill-size: 98304
      max-prefill-tokens: 98304
      context-length: 2020
      cuda-graph-max-bs: 1024
      mamba-scheduler-strategy: "no_buffer"

      decode-log-interval: 1
      stream-interval: 50

benchmark:
  type: "sa-bench"
  isl: 1000
  osl: 1000
  concurrencies: "1x2x4x8x16x32x64x128x256x512x768x1024x1280x1536x2048x2560x3072"
  req_rate: "inf"
